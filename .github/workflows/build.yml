                  val now = System.currentTimeMillis()
                  val fEnd = prefs.getLong("focus_end_ms", 0L)
                  if (fEnd > now) {
                      lockCard.addView(TextView(this).apply {
                          text = "🔥 Focus Lockdown Running (${((fEnd - now) / 60000L) + 1} mins remaining)"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                          setTextColor(Color.parseColor("#FF8A80"))
                          setTypeface(null, Typeface.BOLD)
                          setPadding(0, dp(6), 0, dp(10))
                      })
                      lockCard.addView(secBtn("Emergency Stop Focus Lockdown") {
                          prefs.edit().putLong("focus_end_ms", 0L).apply()
                          renderScreen(false, true)
                      })
                  } else {
                      val hRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(8) }
                      }
                      for (h in 1..5) {
                          val b = TextView(this).apply {
                              text = "${h}h"
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                              setTypeface(null, Typeface.BOLD)
                              setTextColor(Color.WHITE)
                              gravity = Gravity.CENTER
                              background = ripple("#6C47FF", 12f, "#9D7BFF")
                              setPadding(dp(8), dp(12), dp(8), dp(12))
                              layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(dp(3), 0, dp(3), 0) }
                          }
                          spring(b) {
                              prefs.edit().putLong("focus_end_ms", System.currentTimeMillis() + h * 3600000L).apply()
                              Toast.makeText(this, "$h-Hour Focus Lockdown Activated!", Toast.LENGTH_SHORT).show()
                              renderScreen(false, true)
                          }
                          hRow.addView(b)
                      }
                      lockCard.addView(hRow)
                  }
                  lockCard.addView(priBtn("📞 Open Phone Dialer (Calls Always Allowed)", "#10B981") {
                      try { startActivity(Intent(Intent.ACTION_DIAL)) } catch (_: Exception) {}
                  })
                  contentCol.addView(lockCard)
              }

              // ========================================================================
              // MODALS & HELPERS
              // ========================================================================
              private fun promptAddErrorModal() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  var selS = selectedSubj
                  var selC = (syllabus[selS] ?: emptyList()).first()
                  val sRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val cBtn = secBtn("Chapter: $selC ▾") {}
                  val sViews = mutableListOf<TextView>()
                  val sList = listOf("Physics", "Chemistry", "Mathematics")

                  fun sync() {
                      for (i in sList.indices) {
                          val on = (sList[i] == selS)
                          sViews[i].background = ripple(if (on) "#6C47FF" else "#1C1833", 10f)
                      }
                      selC = (syllabus[selS] ?: emptyList()).first()
                      cBtn.text = "Chapter: $selC ▾"
                  }
                  for (s in sList) {
                      val tv = TextView(this).apply {
                          text = if (s == "Mathematics") "Maths" else s
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f); setTextColor(Color.WHITE); setTypeface(null, Typeface.BOLD)
                          gravity = Gravity.CENTER; setPadding(dp(8), dp(9), dp(8), dp(9))
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(dp(2), 0, dp(2), 0) }
                      }
                      spring(tv) { selS = s; sync() }
                      sViews.add(tv); sRow.addView(tv)
                  }
                  sync()
                  spring(cBtn) {
                      val chList = syllabus[selS] ?: emptyList()
                      val nextIdx = (chList.indexOf(selC) + 1) % chList.size
                      selC = chList[nextIdx]
                      cBtn.text = "Chapter: $selC ▾"
                  }
                  val noteIn = editBox("Mistake description (e.g., Forgot formula a = v²/r)")
                  val photoBtn = secBtn("Pick Mistake Photo from Gallery") {
                      pErrSubj = selS; pErrChap = selC
                      pErrNote = noteIn.text.toString().trim().ifEmpty { "$selC: Concept Trap" }
                      errPicker.launch(arrayOf("image/*"))
                  }
                  box.addView(sRow); box.addView(cBtn); box.addView(noteIn); box.addView(photoBtn)

                  showModal("Add Error to Log", "Save a text mistake or attach a photo", box, "Save Text Error") {
                      val n = noteIn.text.toString().trim()
                      if (n.isNotEmpty()) {
                          saveErrorItem(selS, selC, n, "")
                          renderScreen(false, true)
                      }
                  }
              }

              private fun saveErrorItem(subj: String, chap: String, note: String, uri: String) {
                  val arr = getArr("error_book_list")
                  arr.put(JSONObject().apply {
                      put("subject", subj); put("chapter", chap); put("note", note); put("uri", uri)
                      put("date", SimpleDateFormat("yyyy-MM-dd • h:mm a", Locale.US).format(Date()))
                  })
                  saveArr("error_book_list", arr)
              }

              private fun showChapterErrorsModal(subj: String, chap: String) {
                  val all = getArr("error_book_list"); val fil = JSONArray()
                  for (i in 0 until all.length()) {
                      val o = all.getJSONObject(i)
                      if (o.optString("subject") == subj && o.optString("chapter") == chap) fil.put(o)
                  }
                  if (fil.length() == 0) {
                      Toast.makeText(this, "No mistakes recorded for $chap yet!", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val sc = ScrollView(this).apply { layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(380)) }
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  for (i in 0 until fil.length()) col.addView(renderErrorCard(fil.getJSONObject(i), -1, null))
                  sc.addView(col)
                  showModal("$chap Mistakes", "${fil.length()} recorded mistake(s)", sc, "Done") {}
              }

              private fun showWorksheetModal() {
                  val tin = editBox("Worksheet Title (e.g., Rotational Motion DPP #4)")
                  showModal("Upload Worksheet", "Enter sheet name and pick PDF or Image", tin, "Select File") {
                      pSheetTitle = tin.text.toString().trim().ifEmpty { "Worksheet #${System.currentTimeMillis() % 1000}" }
                      pSheetSubj = selectedSubj
                      sheetPicker.launch(arrayOf("application/pdf", "image/*"))
                  }
              }

              private fun showQuoteModal(closeOnDismiss: Boolean) {
                  val d = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0B0914")); setPadding(dp(26), dp(36), dp(26), dp(36))
                  }
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL
                      background = grad("#1F183D", "#120F24", 26f, "#6C47FF"); setPadding(dp(24), dp(32), dp(24), dp(28))
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                  }
                  card.addView(badgeLabel("☀️ FIRST UNLOCK • DAILY JEE IGNITION", "#00E5A3"))
                  val qt = TextView(this).apply {
                      text = "\"Dream Big. Study Hard.\""; setTextSize(TypedValue.COMPLEX_UNIT_SP, 19f)
                      setTextColor(Color.WHITE); setTypeface(null, Typeface.BOLD); gravity = Gravity.CENTER
                      setPadding(dp(8), dp(24), dp(8), dp(24))
                  }
                  card.addView(qt)
                  card.addView(priBtn("Start Today's Grind", "#6C47FF") { d.dismiss(); if (closeOnDismiss) finishAndRemoveTask() })
                  r.addView(card); d.setContentView(r); d.show()

                  Thread {
                      try {
                          val conn = (URL("https://zenquotes.io/api/random").openConnection() as HttpURLConnection).apply {
                              connectTimeout = 3500; readTimeout = 3500
                          }
                          if (conn.responseCode == 200) {
                              val arr = JSONArray(BufferedReader(InputStreamReader(conn.inputStream)).readText())
                              if (arr.length() > 0) {
                                  val o = arr.getJSONObject(0)
                                  val fq = "\"${o.getString("q")}\""
                                  prefs.edit().putString("cached_daily_quote", fq).apply()
                                  runOnUiThread {
                                      qt.text = "$fq\n\n— ${o.getString("a")}"
                                      refreshClock()
                                  }
                              }
                          }
                      } catch (_: Exception) {}
                  }.start()
              }

              private fun showModal(titleTxt: String, subTxt: String, body: View, okTxt: String, onOk: () -> Unit) {
                  val d = Dialog(this)
                  d.requestWindowFeature(Window.FEATURE_NO_TITLE)
                  d.window?.setBackgroundDrawableResource(android.R.color.transparent)
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = grad("#1B1636", "#110E22", 22f, "#3D326B")
                      setPadding(dp(20), dp(20), dp(20), dp(18))
                  }
                  r.addView(TextView(this).apply { text = titleTxt; setTextSize(TypedValue.COMPLEX_UNIT_SP, 17f); setTextColor(Color.WHITE); setTypeface(null, Typeface.BOLD) })
                  r.addView(TextView(this).apply { text = subTxt; setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f); setTextColor(Color.parseColor("#94A3B8")); setPadding(0, dp(4), 0, dp(10)) })
                  r.addView(body)
                  val br = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.END
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(14) }
                  }
                  br.addView(chipBtn("Cancel", "#282246") { d.dismiss() })
                  br.addView(chipBtn(okTxt, "#6C47FF") { d.dismiss(); onOk() })
                  r.addView(br); d.setContentView(r)
                  d.window?.setLayout((resources.displayMetrics.widthPixels * 0.92).roundToInt(), ViewGroup.LayoutParams.WRAP_CONTENT)
                  d.show()
              }

              private fun getCompletedChaptersWithDays(): List<Triple<String, String, Long>> {
                  val res = mutableListOf<Triple<String, String, Long>>()
                  val now = System.currentTimeMillis()
                  for ((s, list) in syllabus) {
                      for (c in list) {
                          if (getChapterPct(s, c) == 100) {
                              var t = prefs.getLong("time_${s}_$c", 0L)
                              if (t <= 0L) {
                                  t = now
                                  prefs.edit().putLong("time_${s}_$c", t).apply()
                              }
                              res.add(Triple(s, c, max(0L, (now - t) / 86400000L)))
                          }
                      }
                  }
                  return res.sortedByDescending { it.third }
              }

              private fun checkPyqAlerts(notify: Boolean) {
                  val due = getCompletedChaptersWithDays().filter { it.third >= 15L }
                  if (due.isNotEmpty() && notify) {
                      val f = due[0]
                      sendBroadcast(Intent(this, ReminderReceiver::class.java).apply {
                          putExtra("TITLE", "⚠️ 15-Day PYQ Revision Due (${due.size} Chapters)")
                          putExtra("MESSAGE", "${f.first}: ${f.second} was completed ${f.third} days ago! Revise via PYQs.")
                          putExtra("NOTIF_ID", 9915)
                      })
                  }
              }

              private fun pickExamDate() {
                  val c = Calendar.getInstance().apply { timeInMillis = prefs.getLong("jee_target_ms", System.currentTimeMillis()) }
                  DatePickerDialog(this, { _, y, m, d ->
                      val nc = Calendar.getInstance().apply { set(y, m, d, 9, 0, 0) }
                      prefs.edit().putLong("jee_target_ms", nc.timeInMillis).apply(); refreshClock()
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show()
              }

              private fun loadThumb(u: String, iv: ImageView) {
                  iv.tag = u
                  val c = bmpCache.get(u)
                  if (c != null) { iv.setImageBitmap(c); return }
                  imgPool.execute {
                      try {
                          val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                          contentResolver.openInputStream(Uri.parse(u))?.use { s ->
                              val b = BitmapFactory.decodeStream(s, null, opts)
                              if (b != null) {
                                  bmpCache.put(u, b)
                                  runOnUiThread { if (iv.tag == u) iv.setImageBitmap(b) }
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun isAccEnabled(): Boolean {
                  val exp = ComponentName(this, FocusAccessibilityService::class.java)
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  val sp = TextUtils.SimpleStringSplitter(':'); sp.setString(s)
                  while (sp.hasNext()) if (ComponentName.unflattenFromString(sp.next()) == exp) return true
                  return false
              }

              private fun openDoc(u: String) {
                  try {
                      val uri = Uri.parse(u)
                      startActivity(Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, contentResolver.getType(uri) ?: "*/*")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      })
                  } catch (_: Exception) { Toast.makeText(this, "Unable to open file.", Toast.LENGTH_SHORT).show() }
              }

              private fun getArr(k: String): JSONArray = try { JSONArray(prefs.getString(k, null) ?: "[]") } catch (_: Exception) { JSONArray() }
              private fun saveArr(k: String, a: JSONArray) = prefs.edit().putString(k, a.toString()).apply()

