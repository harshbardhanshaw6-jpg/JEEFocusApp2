                          contentCol.addView(renderErrorCard(o, i, all))
                      }
                  }

                  val addErrBtn = TextView(this).apply {
                      text = "＋  Add Error"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                      setTextColor(Color.WHITE)
