              )

              private val defaultBlockedDomains = listOf(
                  "youtube.com", "youtu.be", "instagram.com", "reels",
                  "pornhub", "xvideos", "xnxx", "xhamster", "redtube",
                  "youporn", "spankbang", "onlyfans", "chaturbate",
