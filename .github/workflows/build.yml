              private fun buildStudyPlanScreen() {
                  contentCol.addView(topScreenHeader("Study Plan & Sheets", "＋ Task") { promptAddStudyPlanGoalModal() })

                  val goals = getArr("user_study_plan_goals")
                  val doneCnt = (0 until goals.length()).count { goals.getJSONObject(it).optBoolean("done", false) }
                  val planPct = if (goals.length() > 0) ((doneCnt.toFloat() / goals.length()) * 100f).roundToInt() else 0

                  val tCard = cardBox()
                  tCard.addView(badgeLabel("🎯 JEE TARGET STUDY PLAN ($planPct% COMPLETED)", "#00E5A3"))
                  tCard.addView(TextView(this).apply {
                      text = "Add your study milestones and upload coaching worksheets below."
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f)
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, dp(4), 0, dp(10))
                  })
                  tCard.addView(priBtn("＋ Add Study Plan Milestone", "#6C47FF") { promptAddStudyPlanGoalModal() })

                  if (goals.length() == 0) {
                      tCard.addView(TextView(this).apply {
                          text = "No milestones added yet. Tap above to create your custom study checklist."
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f)
                          setTextColor(Color.parseColor("#64748B"))
                          setPadding(0, dp(10), 0, 0)
                      })
                  } else {
                      for (i in 0 until goals.length()) {
                          val o = goals.getJSONObject(i)
                          val d = o.optBoolean("done", false)
                          val r = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              background = ripple(if (d) "#142926" else "#1C1833", 12f, if (d) "#00E5A3" else "#2E2752")
                              setPadding(dp(12), dp(10), dp(12), dp(10))
                              layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(8) }
                          }
                          val tv = TextView(this).apply {
                              text = if (d) "✓ ${o.optString("title")}" else "○ ${o.optString("title")}"
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 13.5f)
                              setTextColor(if (d) Color.parseColor("#00E5A3") else Color.WHITE)
                              setTypeface(null, Typeface.BOLD)
                              layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          }
                          spring(tv) {
                              o.put("done", !d)
                              saveArr("user_study_plan_goals", goals)
                              renderScreen(false, true)
                          }
                          val del = TextView(this).apply {
                              text = "✕"; setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f); setTextColor(Color.parseColor("#94A3B8"))
                              setPadding(dp(8), dp(4), dp(4), dp(4))
                          }
                          spring(del) {
                              val up = JSONArray()
                              for (j in 0 until goals.length()) if (j != i) up.put(goals.getJSONObject(j))
                              saveArr("user_study_plan_goals", up)
                              renderScreen(false, true)
                          }
                          r.addView(tv); r.addView(del)
                          tCard.addView(r)
                      }
                  }
                  contentCol.addView(tCard)

                  val sheets = getArr("worksheets_list")
                  val sCard = cardBox()
                  sCard.addView(badgeLabel("📄 UPLOADED WORKSHEETS (${sheets.length()})", "#A5B4FC"))
                  sCard.addView(secBtn("＋ Upload Worksheet (PDF / Image)") { showWorksheetModal() })
                  if (sheets.length() == 0) {
                      sCard.addView(TextView(this).apply {
                          text = "No worksheets uploaded yet."
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f)
                          setTextColor(Color.parseColor("#94A3B8"))
                          setPadding(0, dp(8), 0, 0)
                      })
                  } else {
                      for (i in 0 until sheets.length()) {
                          val o = sheets.getJSONObject(i)
                          val done = o.optBoolean("done", false)
                          val uri = o.getString("uri")
                          val r = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              background = ripple(if (done) "#142926" else "#1C1833", 14f, if (done) "#00E5A3" else "#2E2752")
                              setPadding(dp(12), dp(12), dp(12), dp(12))
                              layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(8) }
                          }
                          val tv = TextView(this).apply {
                              text = if (done) "✓ [${o.getString("subject")}] ${o.getString("title")}" else "[${o.getString("subject")}] ${o.getString("title")}"
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 13.5f)
                              setTextColor(Color.WHITE)
                              setTypeface(null, Typeface.BOLD)
                              layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          }
                          spring(tv) { openDoc(uri) }
                          r.addView(tv)
                          r.addView(chipBtn("Open", "#3B82F6") { openDoc(uri) })
                          r.addView(chipBtn(if (done) "Undo" else "Done", if (done) "#334155" else "#10B981") {
                              o.put("done", !done); saveArr("worksheets_list", sheets); renderScreen(false, true)
                          })
                          sCard.addView(r)
                      }
                  }
                  contentCol.addView(sCard)
              }

