              private fun loadThumb(u: String, iv: ImageView) {
                  iv.tag = u
                  val c = bmpCache.get(u)
                  if (c != null) { iv.setImageBitmap(c); return }
                  imgPool.execute {
                      try {
                          val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                          contentResolver.openInputStream(Uri.parse(u))?.use { s ->
                              val b = BitmapFactory.decodeStream(s, null, opts)
                              if (b != null) {
                                  bmpCache.put(u, b)
                                  runOnUiThread { if (iv.tag == u) iv.setImageBitmap(b) }
                              }
                          }
                      } catch (_: Exception) {}
                  }
              }

              private fun isAccEnabled(): Boolean {
                  val exp = ComponentName(this, FocusAccessibilityService::class.java)
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  val sp = TextUtils.SimpleStringSplitter(':'); sp.setString(s)
                  while (sp.hasNext()) if (ComponentName.unflattenFromString(sp.next()) == exp) return true
                  return false
              }

              private fun openDoc(u: String) {
                  try {
                      val uri = Uri.parse(u)
                      startActivity(Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, contentResolver.getType(uri) ?: "*/*")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      })
                  } catch (_: Exception) { Toast.makeText(this, "Unable to open file.", Toast.LENGTH_SHORT).show() }
              }

