name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate JEE Ascend Pro UI & Project Files
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/myandroidapp
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JEEFocusApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.myandroidapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.harsh.jeeprep.tracker"
                  minSdk 24
                  targetSdk 34
                  versionCode 9
                  versionName "4.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B0914" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#6C47FF" android:pathData="M54,18 L86,84 L70,84 L54,48 L38,84 L22,84 Z"/>
              <path android:fillColor="#00E5A3" android:pathData="M43,66 L65,66 L71,78 L37,78 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="120" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="JEE Ascend"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FocusAccessibilityService"
                      android:exported="true"
                      android:label="JEE Focus Shield"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <receiver android:name=".ReminderReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/myandroidapp/MainActivity.kt
          package com.example.myandroidapp

          import android.accessibilityservice.AccessibilityService
          import android.animation.ValueAnimator
          import android.app.*
          import android.content.*
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.text.TextUtils
          import android.util.LruCache
          import android.util.TypedValue
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.*
          import androidx.activity.result.ActivityResultLauncher
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.Executors
          import kotlin.math.max
          import kotlin.math.roundToInt

          // ============================================================================
          // 1. SMART ACCESSIBILITY SERVICE (ALLOWS CHROME; ONLY BLOCKS TYPED KEYWORDS)
          // ============================================================================
          class FocusAccessibilityService : AccessibilityService() {
              private var unlockReceiver: BroadcastReceiver? = null
              private var lastBlockedTime = 0L

              private val blockedNativeApps = setOf(
                  "com.google.android.youtube", "com.instagram.android",
                  "com.zhiliaoapp.musically", "com.ss.android.ugc.trill",
                  "com.snapchat.android", "com.facebook.katana", "com.reddit.frontpage"
              )
              private val browsers = setOf(
                  "com.android.chrome", "org.mozilla.firefox", "com.microsoft.emmx",
                  "com.brave.browser", "com.sec.android.app.sbrowser",
                  "com.opera.browser", "com.opera.mini.native", "com.UCMobile.intl"
              )
              private val blockedKeywords = listOf(
                  "youtube.com", "m.youtube.com", "youtu.be", "instagram.com",
                  "pornhub", "xvideos", "xnxx", "xhamster", "redtube", "youporn",
                  "spankbang", "onlyfans", "chaturbate", "stripchat", "brazzers",
                  "eporner", "hqporner", "porn", "xxx"
              )
              private val callPackages = setOf(
                  "com.google.android.dialer", "com.android.dialer", "com.android.incallui",
                  "com.android.server.telecom", "com.samsung.android.incallui",
                  "com.samsung.android.dialer", "com.coloros.phonemanager",
                  "com.android.contacts", "com.android.systemui", "android"
              )

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (unlockReceiver == null) {
                      unlockReceiver = object : BroadcastReceiver() {
                          override fun onReceive(c: Context, i: Intent) {
                              if (i.action == Intent.ACTION_USER_PRESENT) checkMorningQuote(c)
                          }
                      }
                      val f = IntentFilter(Intent.ACTION_USER_PRESENT)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          registerReceiver(unlockReceiver, f, Context.RECEIVER_EXPORTED)
                      } else {
                          registerReceiver(unlockReceiver, f)
                      }
                  }
              }

              private fun checkMorningQuote(c: Context) {
                  val p = c.getSharedPreferences("jee_command_db", Context.MODE_PRIVATE)
                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  if (p.getString("last_morning_quote_date", "") != today) {
                      p.edit().putString("last_morning_quote_date", today).apply()
                      c.startActivity(Intent(c, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          putExtra("MORNING_UNLOCK_QUOTE", true)
                      })
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return
                  val kg = getSystemService(Context.KEYGUARD_SERVICE) as? KeyguardManager
                  if (kg?.isKeyguardLocked == false) checkMorningQuote(this)

                  if (pkg == applicationContext.packageName || pkg.contains("inputmethod") ||
                      pkg.contains("keyboard") || pkg.contains("launcher") ||
                      pkg.contains("permissioncontroller") || pkg.contains("systemui")) return

                  val p = getSharedPreferences("jee_command_db", Context.MODE_PRIVATE)
                  val focusActive = p.getLong("focus_end_ms", 0L) > System.currentTimeMillis()
                  val shieldOn = p.getBoolean("always_shield_enabled", true)

                  // 1. Hardcore Focus Session (1h-5h): Block non-call external apps
                  if (focusActive) {
                      val isCall = callPackages.contains(pkg) || pkg.contains("dialer") ||
                              pkg.contains("incall") || pkg.contains("telecom") || pkg.contains("phone")
                      if (!isCall) {
                          redirectHome("Focus Mode Active! Only Phone Calls & JEE Ascend allowed.")
                          return
                      }
                  }

                  // 2. 24/7 Shield: Block native YouTube/Instagram apps, allow Chrome to open
                  if (shieldOn || focusActive) {
                      if (blockedNativeApps.contains(pkg)) {
                          redirectHome("Blocked by JEE Ascend Shield!")
                          return
                      }
                      // 3. Inside Chrome/Browsers: Only block if address bar contains a restricted keyword
                      if (browsers.contains(pkg) || pkg.contains("browser") || pkg.contains("chrome")) {
                          val root = rootInActiveWindow ?: return
                          val custom = (p.getString("custom_blocked_sites", "") ?: "")
                              .split(",").map { it.trim().lowercase() }.filter { it.length >= 3 }
                          val kwList = blockedKeywords + custom
                          val hit = findUrlBarMatch(root, kwList)
                          if (hit != null) {
                              val now = System.currentTimeMillis()
                              if (now - lastBlockedTime > 1400L) {
                                  lastBlockedTime = now
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  Handler(Looper.getMainLooper()).postDelayed({
                                      Toast.makeText(applicationContext, "Blocked restricted site: $hit", Toast.LENGTH_SHORT).show()
                                  }, 150)
                              }
                          }
                      }
                  }
              }

              private fun findUrlBarMatch(n: AccessibilityNodeInfo?, kwList: List<String>): String? {
                  if (n == null) return null
                  val id = n.viewIdResourceName?.lowercase() ?: ""
                  if (id.contains("url_bar") || id.contains("omnibox") || id.contains("location_bar") ||
                      id.contains("address_bar") || id.contains("mozac_browser_toolbar_url")) {
                      val t = n.text?.toString()?.lowercase()?.trim() ?: ""
                      if (t.isNotEmpty() && !t.contains("search or type") && !t.contains("search google")) {
                          for (kw in kwList) if (t.contains(kw)) return kw
                      }
                  }
                  for (i in 0 until n.childCount) {
                      val m = findUrlBarMatch(n.getChild(i), kwList)
                      if (m != null) return m
                  }
                  return null
              }

              private fun redirectHome(msg: String) {
                  val now = System.currentTimeMillis()
                  if (now - lastBlockedTime < 1300L) return
                  lastBlockedTime = now
                  performGlobalAction(GLOBAL_ACTION_HOME)
                  Handler(Looper.getMainLooper()).postDelayed({
                      Toast.makeText(applicationContext, msg, Toast.LENGTH_LONG).show()
                      startActivity(Intent(applicationContext, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      })
                  }, 200)
              }

              override fun onInterrupt() {}
          }

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val title = intent.getStringExtra("TITLE") ?: "JEE Ascend"
                  val msg = intent.getStringExtra("MESSAGE") ?: "Time for your scheduled study block!"
                  val id = intent.getIntExtra("NOTIF_ID", 1001)
                  val chId = "jee_ascend_channel"
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(NotificationChannel(chId, "JEE Ascend Alerts", NotificationManager.IMPORTANCE_HIGH))
                  }
                  val pi = PendingIntent.getActivity(context, id, Intent(context, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  nm.notify(id, NotificationCompat.Builder(context, chId)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(title).setContentText(msg)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(msg))
                      .setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).setContentIntent(pi).build())
              }
          }

          // ============================================================================
          // 2. HERO ROOFTOP ASPIRANT + FROSTED COUNTDOWN VIEW (SCREEN 1 TOP)
          // ============================================================================
          class AscendHeroCountdownView(context: Context) : View(context) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val path = Path()
              private val r = RectF()
              private var dStr = "548"; private var hStr = "10"; private var mStr = "32"; private var sStr = "17"
              private var quoteStr = "\"Dream Big. Study Hard.\""
              private var titleStr = "JEE 2027 Countdown"

              fun update(d: Long, h: Long, m: Long, s: Long, q: String, t: String) {
                  dStr = String.format(Locale.US, "%02d", d)
                  hStr = String.format(Locale.US, "%02d", h)
                  mStr = String.format(Locale.US, "%02d", m)
                  sStr = String.format(Locale.US, "%02d", s)
                  quoteStr = q; titleStr = t
                  invalidate()
              }

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  setMeasuredDimension(MeasureSpec.getSize(wSpec), (300 * resources.displayMetrics.density).roundToInt())
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  val dp = resources.displayMetrics.density
                  val w = width.toFloat(); val h = height.toFloat()

                  // Night Sky Cosmic Gradient
                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(0f, 0f, 0f, h,
                      intArrayOf(Color.parseColor("#0D0A1A"), Color.parseColor("#1A1438"), Color.parseColor("#110E20")),
                      floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  r.set(0f, 0f, w, h); c.drawRoundRect(r, 24f * dp, 24f * dp, p); p.shader = null

                  // Stars & Shooting Star
                  p.color = Color.parseColor("#88FFFFFF")
                  c.drawCircle(w * 0.45f, 22f * dp, 1.3f * dp, p)
                  c.drawCircle(w * 0.62f, 16f * dp, 1.6f * dp, p)
                  c.drawCircle(w * 0.82f, 28f * dp, 1.2f * dp, p)
                  p.strokeWidth = 1.5f * dp; p.color = Color.parseColor("#AA93C5FD")
                  c.drawLine(w * 0.46f, 38f * dp, w * 0.58f, 22f * dp, p)

                  // Brand Logo 'A' + JEE Ascend Header
                  path.reset()
                  path.moveTo(28f * dp, 18f * dp); path.lineTo(44f * dp, 52f * dp)
                  path.lineTo(36f * dp, 52f * dp); path.lineTo(28f * dp, 34f * dp)
                  path.lineTo(20f * dp, 52f * dp); path.lineTo(12f * dp, 52f * dp); path.close()
                  p.color = Color.parseColor("#7C4DFF"); c.drawPath(path, p)
                  p.color = Color.parseColor("#00E5A3")
                  r.set(21f * dp, 41f * dp, 35f * dp, 46f * dp); c.drawRoundRect(r, 2f * dp, 2f * dp, p)

                  p.color = Color.WHITE; p.textSize = 17f * dp
                  p.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  c.drawText("JEE", 52f * dp, 31f * dp, p)
                  c.drawText("Ascend", 52f * dp, 48f * dp, p)
                  p.color = Color.parseColor("#94A3B8"); p.textSize = 9.5f * dp; p.typeface = Typeface.DEFAULT
                  c.drawText("Plan. Study. Crack.", 52f * dp, 60f * dp, p)

                  // Distant City Lights Bokeh
                  val cityColors = intArrayOf(Color.parseColor("#55FBBF24"), Color.parseColor("#5538BDF8"), Color.parseColor("#55A855F7"))
                  for (i in 0..16) {
                      p.color = cityColors[i % 3]
                      c.drawCircle((18f + i * 21f) * dp, 122f * dp + (i % 3) * 4f * dp, 2.5f * dp, p)
                  }

                  // Rooftop Ledge & Seated Student Silhouette
                  p.color = Color.parseColor("#18132C")
                  r.set(w * 0.48f, 118f * dp, w, 136f * dp); c.drawRect(r, p)
                  val sx = w * 0.72f; val sy = 74f * dp
                  p.color = Color.parseColor("#090710")
                  c.drawCircle(sx, sy, 8.5f * dp, p) // Head
                  r.set(sx - 8f * dp, sy + 8f * dp, sx + 10f * dp, sy + 42f * dp)
                  c.drawRoundRect(r, 6f * dp, 6f * dp, p) // Torso/Hoodie
                  c.drawLine(sx - 6f * dp, sy + 38f * dp, sx - 22f * dp, sy + 26f * dp, p)

                  // Frosted Glass Countdown Card
                  val cardTop = 132f * dp; val cardBot = 258f * dp
                  p.color = Color.parseColor("#CC17132B")
                  r.set(14f * dp, cardTop, w - 14f * dp, cardBot)
                  c.drawRoundRect(r, 20f * dp, 20f * dp, p)
                  p.style = Paint.Style.STROKE; p.strokeWidth = 1.2f * dp; p.color = Color.parseColor("#3D3366")
                  c.drawRoundRect(r, 20f * dp, 20f * dp, p); p.style = Paint.Style.FILL

                  p.textAlign = Paint.Align.CENTER
                  p.color = Color.parseColor("#E2E8F0"); p.textSize = 13.5f * dp
                  p.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  c.drawText(titleStr, w * 0.5f, cardTop + 26f * dp, p)

                  // Giant Countdown Digits: 548 : 10 : 32 : 17
                  p.color = Color.WHITE; p.textSize = 32f * dp
                  p.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  c.drawText("$dStr : $hStr : $mStr : $sStr", w * 0.5f, cardTop + 72f * dp, p)

                  p.color = Color.parseColor("#94A3B8"); p.textSize = 11.5f * dp; p.typeface = Typeface.DEFAULT
                  c.drawText("Days            Hours         Minutes       Seconds", w * 0.5f, cardTop + 96f * dp, p)

                  p.color = Color.parseColor("#CBD5E1"); p.textSize = 13f * dp
                  p.typeface = Typeface.create(Typeface.DEFAULT, Typeface.ITALIC)
                  c.drawText(quoteStr, w * 0.5f, 282f * dp, p)
                  p.textAlign = Paint.Align.LEFT
              }
          }

          // ============================================================================
          // 3. CIRCULAR RADIAL RING VIEW (USED IN SYLLABUS & 3-RING ANALYTICS)
          // ============================================================================
          class RadialDonutView(
              context: Context,
              private val pct: Int,
              private val ringColor: Int,
              private val sizeDp: Int = 82,
              private val labelUnder: String? = null
          ) : View(context) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val arc = RectF()
              private var animProg = 0f

              init {
                  ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 650L
                      interpolator = DecelerateInterpolator(1.6f)
                      addUpdateListener { animProg = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  val d = resources.displayMetrics.density
                  val w = (sizeDp * d).roundToInt()
                  val extraH = if (labelUnder != null) (24 * d).roundToInt() else 0
                  setMeasuredDimension(w, w + extraH)
              }

              override fun onDraw(c: Canvas) {
                  super.onDraw(c)
                  val d = resources.displayMetrics.density
                  val s = sizeDp * d
                  val stroke = 8.5f * d
                  val pad = stroke / 2f + 3f * d
                  arc.set(pad, pad, s - pad, s - pad)

                  p.style = Paint.Style.STROKE; p.strokeWidth = stroke; p.strokeCap = Paint.Cap.ROUND
                  p.color = Color.parseColor("#262142")
                  c.drawOval(arc, p)

                  p.color = ringColor
                  c.drawArc(arc, -90f, 360f * (pct / 100f) * animProg, false, p)

                  p.style = Paint.Style.FILL; p.textAlign = Paint.Align.CENTER
                  p.color = Color.WHITE; p.textSize = (sizeDp * 0.22f) * d
                  p.typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  c.drawText("${(pct * animProg).roundToInt()}%", s / 2f, s / 2f + 6f * d, p)

                  if (labelUnder != null) {
                      p.color = Color.parseColor("#CBD5E1"); p.textSize = 12f * d; p.typeface = Typeface.DEFAULT
                      c.drawText(labelUnder, s / 2f, s + 16f * d, p)
                  }
              }
          }

          // ============================================================================
          // 4. MAIN ACTIVITY: ALL 7 SCREENS OF JEE ASCEND
          // ============================================================================
          class MainActivity : AppCompatActivity() {
              private lateinit var prefs: SharedPreferences
              private var heroView: AscendHeroCountdownView? = null
              private lateinit var mainScroll: ScrollView
              private lateinit var contentCol: LinearLayout
              private val navViews = mutableListOf<LinearLayout>()

              // Screens: 0=Home, 1=Timetable, 2=Syllabus, 3=ErrorLog, 4=Analytics, 5=StudyPlan, 6=Settings
              private var currentScreen = 0
              private var selectedSubj = "Physics"
              private var selectedDay = "Mon"
              private var expandedChapter = ""
              private var errFilter = "All"
              private var planTabActive = true

              private val weekDays = listOf("Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun")
              private val imgPool = Executors.newFixedThreadPool(2)
              private val bmpCache = object : LruCache<String, Bitmap>(16 * 1024 * 1024) {
                  override fun sizeOf(k: String, v: Bitmap): Int = v.byteCount
              }

              private lateinit var sheetPicker: ActivityResultLauncher<Array<String>>
              private lateinit var errPicker: ActivityResultLauncher<Array<String>>
              private lateinit var ttPicker: ActivityResultLauncher<Array<String>>
              private var pSheetTitle = ""; private var pSheetSubj = "Physics"
              private var pErrSubj = "Physics"; private var pErrChap = ""; private var pErrNote = ""

              private val uiHandler = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() { refreshClock(); uiHandler.postDelayed(this, 1000L) }
              }

              private val syllabus = mapOf(
                  "Physics" to listOf(
                      "Mechanics", "Kinematics (1D & 2D)", "Laws of Motion",
                      "Work, Energy & Power", "Rotational Motion", "Gravitation",
                      "Electrodynamics", "Electrostatics", "Current Electricity",
                      "Magnetism", "EMI", "Ray Optics", "Wave Optics", "Modern Physics"
                  ),
                  "Chemistry" to listOf(
                      "Mole Concept", "Atomic Structure", "Chemical Bonding",
                      "Thermodynamics", "Chemical & Ionic Equilibrium", "Electrochemistry",
                      "Chemical Kinetics", "Coordination Compounds", "Organic: GOC",
                      "Hydrocarbons", "Haloalkanes & Haloarenes", "Aldehydes & Ketones", "Amines"
                  ),
                  "Mathematics" to listOf(
                      "Quadratic Equations", "Complex Numbers", "Matrices & Determinants",
                      "Permutations & Combinations", "Limits & Continuity", "Application of Derivatives",
                      "Indefinite & Definite Integration", "Differential Equations",
                      "Straight Lines & Circles", "Conic Sections", "Vectors & 3D", "Probability"
                  )
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor("#0B0914")
                  window.navigationBarColor = Color.parseColor("#0B0914")
                  prefs = getSharedPreferences("jee_command_db", Context.MODE_PRIVATE)

                  if (!prefs.contains("jee_target_ms")) {
                      val c = Calendar.getInstance().apply { set(2027, Calendar.JANUARY, 20, 9, 0, 0) }
                      prefs.edit().putLong("jee_target_ms", c.timeInMillis).apply()
                  }

                  seedInitialDataIfNeeded()
                  initPickers()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(this, android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 101)
                  }

                  buildShell()
                  checkPyqAlerts(false)

                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  val unlock = intent.getBooleanExtra("MORNING_UNLOCK_QUOTE", false)
