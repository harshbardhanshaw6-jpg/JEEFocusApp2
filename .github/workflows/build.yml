              private fun promptEditPyqStatsModal() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val solvedIn = editBox("Solved PYQs Count (e.g., 120)").apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(prefs.getInt("user_pyq_solved", 0).toString())
                  }
                  val totalIn = editBox("Target Total PYQs (e.g., 1000)").apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(prefs.getInt("user_pyq_total", 0).toString())
                  }
                  val accIn = editBox("Overall PYQ Accuracy % (0 - 100)").apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(prefs.getInt("user_pyq_accuracy", 0).toString())
                  }
                  box.addView(solvedIn); box.addView(totalIn); box.addView(accIn)
                  showModal("Update PYQ Stats", "Enter your real PYQ count and accuracy percentage", box, "Save Stats") {
                      val s = solvedIn.text.toString().trim().toIntOrNull() ?: 0
                      val t = totalIn.text.toString().trim().toIntOrNull() ?: 0
                      val a = (accIn.text.toString().trim().toIntOrNull() ?: 0).coerceIn(0, 100)
                      prefs.edit()
                          .putInt("user_pyq_solved", max(0, s))
                          .putInt("user_pyq_total", max(0, t))
                          .putInt("user_pyq_accuracy", a)
                          .apply()
                      renderScreen(false, true)
                  }
              }

              private fun promptAddWeakChapterModal() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val nameIn = editBox("Chapter / Topic Name (e.g., Rotational Mechanics)")
                  val pctIn = editBox("Current Accuracy / Mastery % (e.g., 40)").apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                  }
                  box.addView(nameIn); box.addView(pctIn)
                  showModal("Add Weak Chapter", "Log a weak chapter to track on your Analytics screen", box, "Add") {
                      val name = nameIn.text.toString().trim()
                      val pct = (pctIn.text.toString().trim().toIntOrNull() ?: 0).coerceIn(0, 100)
                      if (name.isNotEmpty()) {
                          val arr = getArr("user_weak_chapters")
                          arr.put(JSONObject().apply { put("name", name); put("pct", pct) })
                          saveArr("user_weak_chapters", arr)
                          renderScreen(false, true)
                      }
                  }
              }

