                      }
                      navViews.add(col)
                      navBar.addView(col)
                  }

                  root.addView(mainScroll)
                  root.addView(navBar)
                  setContentView(root)
                  renderScreen(true, false)
              }

              private fun refreshClock() {
                  val digitsTv = countdownDigitsTv ?: return
                  val target = prefs.getLong("jee_target_ms", 0L)
                  val now = System.currentTimeMillis()
                  val diff = max(0L, target - now)
                  val d = diff / 86400000L
                  val h = (diff / 3600000L) % 24
                  val m = (diff / 60000L) % 60
                  val s = (diff / 1000L) % 60

                  digitsTv.text = String.format(Locale.US, "%02d : %02d : %02d : %02d", d, h, m, s)
                  val yearStr = SimpleDateFormat("yyyy", Locale.US).format(Date(target))
                  countdownTitleTv?.text = "JEE $yearStr Countdown"

                  val fEnd = prefs.getLong("focus_end_ms", 0L)
                  countdownQuoteTv?.text = if (fEnd > now) {
                      "🔒 Focus Lockdown (${((fEnd - now) / 60000L) + 1}m left) • Calls Allowed"
                  } else {
                      prefs.getString("cached_daily_quote", "\"Dream Big. Study Hard.\"") ?: "\"Dream Big. Study Hard.\""
                  }
              }

              private fun renderScreen(animate: Boolean, keepScroll: Boolean) {
                  val sy = if (keepScroll) mainScroll.scrollY else 0
                  contentCol.removeAllViews()
                  countdownDigitsTv = null
                  countdownTitleTv = null
                  countdownQuoteTv = null
                  heroBannerImageView = null

                  when (currentScreen) {
                      0 -> buildHomeScreen()
                      1 -> buildTimetableScreen()
                      2 -> buildSyllabusScreen()
                      3 -> buildErrorLogScreen()
                      4 -> buildAnalyticsScreen()
                      5 -> buildStudyPlanScreen()
                      6 -> buildSettingsScreen()
                  }

                  if (animate) {
                      contentCol.alpha = 0f
                      contentCol.translationY = dpF(14f)
                      contentCol.animate().alpha(1f).translationY(0f).setDuration(210).setInterpolator(DecelerateInterpolator()).start()
                  }
                  mainScroll.post { mainScroll.scrollTo(0, sy) }
              }

