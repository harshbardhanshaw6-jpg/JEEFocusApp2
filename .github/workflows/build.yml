                  setPadding(dp(12), dp(11), dp(12), dp(11))
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(8) }
                  spring(this, click)
              }
              private fun chipBtn(l: String, c: String, click: () -> Unit) = TextView(this).apply {
                  text = l; setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f); setTypeface(null, Typeface.BOLD)
                  setTextColor(Color.WHITE); gravity = Gravity.CENTER; background = ripple(c, 10f)
                  setPadding(dp(12), dp(8), dp(12), dp(8))
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { leftMargin = dp(6) }
                  spring(this, click)
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-focus-command-apk
          path: app/build/outputs/apk/debug/app-debug.apk
