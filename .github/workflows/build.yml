name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Manifest, Device Admin, and Logo
        run: |
          rm -rf app/src/main/res/mipmap* app/src/main/res/drawable*
          mkdir -p app/src/main/res/drawable app/src/main/res/xml
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'android.useAndroidX=true' 'android.nonTransitiveRClass=true' > gradle.properties
          printf '%s\n' 'plugins {' 'id "com.android.application" version "8.5.2" apply false' 'id "org.jetbrains.kotlin.android" version "1.9.24" apply false' '}' > build.gradle
          printf '%s\n' 'plugins {' 'id "com.android.application"' 'id "org.jetbrains.kotlin.android"' '}' 'android {' 'namespace "com.example.myandroidapp"' 'compileSdk 34' 'defaultConfig {' 'applicationId "in.harsh.jeefocus"' 'minSdk 24' 'targetSdk 34' 'versionCode 3' 'versionName "1.2"' '}' 'compileOptions {' 'sourceCompatibility JavaVersion.VERSION_17' 'targetCompatibility JavaVersion.VERSION_17' '}' 'kotlinOptions {' 'jvmTarget = "17"' '}' '}' 'dependencies {' 'implementation "androidx.core:core-ktx:1.12.0"' 'implementation "androidx.appcompat:appcompat:1.6.1"' 'implementation "com.google.android.material:material:1.11.0"' '}' > app/build.gradle
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">' '<path android:fillColor="#0B0F19" android:pathData="M0,0h108v108h-108z"/>' '<path android:fillColor="#151C2C" android:strokeColor="#4F46E5" android:strokeWidth="4" android:pathData="M54,14 L88,30 L88,62 C88,80 54,94 54,94 C54,94 20,80 20,62 L20,30 Z"/>' '<path android:fillColor="#00000000" android:strokeColor="#38BDF8" android:strokeWidth="3" android:pathData="M54,36 A18,18 0 1,1 53.9,36 Z"/>' '<path android:fillColor="#10B981" android:pathData="M54,48 A6,6 0 1,1 53.9,48 Z"/>' '</vector>' > app/src/main/res/drawable/ic_launcher.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged" android:accessibilityFeedbackType="feedbackGeneric" android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews" android:canRetrieveWindowContent="true" android:notificationTimeout="100"/>' > app/src/main/res/xml/accessibility_service_config.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<device-admin xmlns:android="http://schemas.android.com/apk/res/android">' '<uses-policies/>' '</device-admin>' > app/src/main/res/xml/device_admin_config.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' '<uses-permission android:name="android.permission.INTERNET"/>' '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' '<uses-permission android:name="android.permission.VIBRATE"/>' '<application android:allowBackup="true" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:label="JEE Focus Command" android:theme="@style/Theme.Material3.DayNight.NoActionBar">' '<activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask">' '<intent-filter>' '<action android:name="android.intent.action.MAIN"/>' '<category android:name="android.intent.action.LAUNCHER"/>' '</intent-filter>' '</activity>' '<service android:name=".FocusAccessibilityService" android:exported="true" android:label="JEE Focus Shield" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">' '<intent-filter>' '<action android:name="android.accessibilityservice.AccessibilityService"/>' '</intent-filter>' '<meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>' '</service>' '<receiver android:name=".FocusDeviceAdminReceiver" android:exported="true" android:label="JEE Focus Admin Lock" android:permission="android.permission.BIND_DEVICE_ADMIN">' '<meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin_config"/>' '<intent-filter>' '<action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>' '</intent-filter>' '</receiver>' '<receiver android:name=".ReminderReceiver" android:exported="false"/>' '</application>' '</manifest>' > app/src/main/AndroidManifest.xml
          sed -i 's/"com.example.myandroidapp"/packageName/g' app/src/main/java/com/example/myandroidapp/MainActivity.kt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-focus-command-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
