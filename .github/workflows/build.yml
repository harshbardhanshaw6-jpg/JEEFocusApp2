                              val isDone = o.optBoolean("done", false)
                              val itemBox = LinearLayout(this).apply {
                                  orientation = LinearLayout.HORIZONTAL
                                  gravity = Gravity.CENTER_VERTICAL
                                  setPadding(0, if (i == 0) 0 else dp(10), 0, 0)
                              }
                              val tInfo = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                              }
                              tInfo.addView(TextView(this).apply {
                                  text = if (isDone) "✓ ${o.getString("task")}" else o.getString("task")
                                  setTextSize(TypedValue.COMPLEX_UNIT_SP, 14.5f)
                                  setTextColor(if (isDone) Color.parseColor("#00E5A3") else Color.WHITE)
                                  setTypeface(null, Typeface.BOLD)
                              })
                              tInfo.addView(TextView(this).apply {
                                  text = o.getString("time")
                                  setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                                  setTextColor(Color.parseColor("#94A3B8"))
                              })
                              spring(tInfo) {
                                  o.put("done", !isDone)
                                  saveArr("schedule_$dName", slots)
                                  renderScreen(false, true)
                              }
                              val delTv = TextView(this).apply {
                                  text = "✕"
                                  setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                                  setTextColor(Color.parseColor("#64748B"))
                                  setPadding(dp(8), dp(4), dp(4), dp(4))
                              }
                              spring(delTv) {
                                  val up = JSONArray()
                                  for (j in 0 until slots.length()) if (j != i) up.put(slots.getJSONObject(j))
                                  saveArr("schedule_$dName", up)
                                  renderScreen(false, true)
                              }
                              itemBox.addView(tInfo)
                              itemBox.addView(delTv)
                              tasksCol.addView(itemBox)
                          }
                      }

                      dayCard.addView(leftCol)
                      dayCard.addView(checkCircle)
                      dayCard.addView(tasksCol)
                      contentCol.addView(dayCard)
                  }

                  // Floating Purple "+ Add Task" Pill Button
                  val addTaskBtn = TextView(this).apply {
                      text = "＋  Add Task to $selectedDay"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14.5f)
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = grad("#7C4DFF", "#5B21B6", 50f, "#A78BFA")
                      setPadding(dp(28), dp(14), dp(28), dp(14))
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          topMargin = dp(4); bottomMargin = dp(18)
                      }
                  }
                  spring(addTaskBtn) { promptAddDayTask(selectedDay) }
                  contentCol.addView(addTaskBtn)

                  // SPACED REPETITION COMPLETED CHAPTERS TRACKER (SHOWS EVERY COMPLETED CHAPTER & DAYS AGO)
                  val srCard = cardBox()
                  val completedList = getCompletedChaptersWithDays()
                  srCard.addView(badgeLabel("🔔 SPACED REPETITION • COMPLETED CHAPTERS (${completedList.size})", "#00E5A3"))
                  srCard.addView(TextView(this).apply {
                      text = "Every chapter marked Completed (100%) in Syllabus appears here immediately with how many days ago it was completed."
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      setTextColor(Color.parseColor("#94A3B8"))
                      setPadding(0, dp(4), 0, dp(10))
                  })

                  if (completedList.isEmpty()) {
                      srCard.addView(TextView(this).apply {
                          text = "No chapters marked Completed yet. Mark any chapter 100% in Syllabus to track it here!"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f)
                          setTextColor(Color.parseColor("#94A3B8"))
                      })
                  } else {
                      for ((subj, chap, daysAgo) in completedList) {
                          val due = daysAgo >= 15L
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = Gravity.CENTER_VERTICAL
                              background = ripple(if (due) "#2D1424" else "#1C1833", 14f, if (due) "#FF5252" else "#342D5C")
                              setPadding(dp(12), dp(12), dp(12), dp(12))
                              layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                                  topMargin = dp(8)
                              }
                          }
                          val cInfo = LinearLayout(this).apply {
                              orientation = LinearLayout.VERTICAL
                              layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          }
                          cInfo.addView(TextView(this).apply {
                              text = "$subj • $chap"
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                              setTextColor(Color.WHITE)
                              setTypeface(null, Typeface.BOLD)
                          })
                          val dayTxt = if (daysAgo == 0L) "Completed Today (0 days ago)" else "Completed $daysAgo day(s) ago"
                          cInfo.addView(TextView(this).apply {
                              text = if (due) "⚠️ $dayTxt • 15+ Days: Revise PYQs Now!" else "✓ $dayTxt • Next PYQ in ${15L - daysAgo}d"
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                              setTextColor(if (due) Color.parseColor("#FF8A80") else Color.parseColor("#00E5A3"))
                          })
                          row.addView(cInfo)
                          row.addView(chipBtn(if (due) "PYQs Done" else "Sim 15d+", if (due) "#10B981" else "#2E2752") {
                              val targetTime = if (due) System.currentTimeMillis() else System.currentTimeMillis() - 16L * 86400000L
                              prefs.edit().putLong("time_${subj}_$chap", targetTime).apply()
                              if (!due) checkPyqAlerts(true)
                              renderScreen(false, true)
                          })
                          srCard.addView(row)
                      }
                  }
                  contentCol.addView(srCard)
              }

              // ========================================================================
              // SCREEN 2: SYLLABUS (PHYSICS | CHEMISTRY | MATHS + 72% RING + % ROWS)
              // ========================================================================
              private fun buildSyllabusScreen() {
                  contentCol.addView(topScreenHeader("📊  Syllabus", "🔔") { checkPyqAlerts(true) })

                  // Subject Tabs: Physics | Chemistry | Mathematics
                  val subjRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          bottomMargin = dp(14)
                      }
                  }
                  for (s in listOf("Physics", "Chemistry", "Mathematics")) {
                      val on = (s == selectedSubj)
                      val p = TextView(this).apply {
                          text = s
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f)
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(if (on) Color.WHITE else Color.parseColor("#94A3B8"))
                          gravity = Gravity.CENTER
                          background = ripple(if (on) "#6C47FF" else "#161329", 20f, if (on) "#9D7BFF" else "#282246")
                          setPadding(dp(12), dp(9), dp(12), dp(9))
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                              setMargins(dp(3), 0, dp(3), 0)
                          }
                      }
                      spring(p) { selectedSubj = s; renderScreen(false, true) }
                      subjRow.addView(p)
                  }
                  contentCol.addView(subjRow)

                  // Overall Progress Donut Card (Matches Screen 3 of Reference Image)
                  val chaps = syllabus[selectedSubj] ?: emptyList()
                  var score = 0f
                  for (c in chaps) {
                      val st = prefs.getInt("status_${selectedSubj}_$c", 0)
                      score += if (st == 2) 1f else if (st == 1) 0.65f else 0f
                  }
                  val subjPct = ((score / max(chaps.size, 1)) * 100f).roundToInt()

                  val progCard = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = grad("#1B1633", "#141124", 20f, "#2E2752")
                      setPadding(dp(18), dp(16), dp(18), dp(16))
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          bottomMargin = dp(14)
                      }
                  }
                  progCard.addView(RadialDonutView(this, subjPct, Color.parseColor("#00E5A3"), 76))
                  val pTextCol = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), 0, 0, 0)
                  }
                  pTextCol.addView(TextView(this).apply {
                      text = "Overall Progress"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      setTextColor(Color.parseColor("#CBD5E1"))
                  })
                  pTextCol.addView(TextView(this).apply {
                      text = "$subjPct%"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 28f)
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                  })
                  progCard.addView(pTextCol)
                  contentCol.addView(progCard)

                  // Chapter List Container
                  val listCard = cardBox()
                  val allErrors = getArr("error_book_list")
                  val now = System.currentTimeMillis()

                  for (chap in chaps) {
                      val key = "${selectedSubj}_$chap"
                      val st = prefs.getInt("status_$key", 0)
                      val compAt = prefs.getLong("time_$key", 0L)
                      val pctTxt = when (st) { 2 -> "100%"; 1 -> "65%"; else -> "0%" }
                      val isExp = (expandedChapter == key)

                      var errCount = 0
                      for (i in 0 until allErrors.length()) {
                          val eo = allErrors.getJSONObject(i)
                          if (eo.getString("subject") == selectedSubj && eo.getString("chapter") == chap) errCount++
                      }

                      val itemWrap = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = ripple(if (isExp) "#211B3D" else "#161329", 14f, if (isExp) "#6C47FF" else "#262142")
                          setPadding(dp(14), dp(14), dp(14), dp(14))
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                              bottomMargin = dp(8)
                          }
                      }

                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }
                      row.addView(TextView(this).apply {
                          text = if (st == 2) "✓" else if (st == 1) "◐" else "○"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                          setTextColor(Color.WHITE)
                          gravity = Gravity.CENTER
                          background = ripple(if (st == 2) "#00E5A3" else if (st == 1) "#6C47FF" else "#2B254A", 50f)
                          layoutParams = LinearLayout.LayoutParams(dp(24), dp(24)).apply { rightMargin = dp(12) }
                      })
                      row.addView(TextView(this).apply {
                          text = chap
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 14.5f)
                          setTextColor(Color.WHITE)
                          setTypeface(null, Typeface.BOLD)
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      })
                      row.addView(TextView(this).apply {
                          text = pctTxt
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                          setTextColor(if (st > 0) Color.parseColor("#00E5A3") else Color.parseColor("#94A3B8"))
                          setTypeface(null, Typeface.BOLD)
                          setPadding(0, 0, dp(10), 0)
                      })
                      row.addView(TextView(this).apply {
                          text = if (isExp) "⌃" else "⌄"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                          setTextColor(Color.parseColor("#94A3B8"))
                      })

                      spring(row) {
                          expandedChapter = if (isExp) "" else key
                          renderScreen(false, true)
                      }
                      itemWrap.addView(row)

                      if (isExp) {
                          val stateRow = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                                  topMargin = dp(12)
                              }
                          }
                          fun stBtn(lbl: String, target: Int, col: String) {
                              val on = (st == target)
                              val b = TextView(this).apply {
                                  text = lbl
                                  setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                                  setTypeface(null, Typeface.BOLD)
                                  setTextColor(Color.WHITE)
                                  gravity = Gravity.CENTER
                                  background = ripple(if (on) col else "#120F22", 10f, if (on) "#FFFFFF" else "#2E2752")
                                  setPadding(dp(6), dp(8), dp(6), dp(8))
                                  layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply {
                                      setMargins(dp(3), 0, dp(3), 0)
                                  }
                              }
                              spring(b) {
                                  prefs.edit()
                                      .putInt("status_$key", target)
                                      .putLong("time_$key", if (target == 2) System.currentTimeMillis() else 0L)
                                      .apply()
                                  renderScreen(false, true)
                              }
                              stateRow.addView(b)
                          }
                          stBtn("0% Pending", 0, "#475569")
                          stBtn("65% Partial", 1, "#6C47FF")
                          stBtn("100% Done", 2, "#10B981")
                          itemWrap.addView(stateRow)

                          if (st == 2 && compAt > 0L) {
                              val dAgo = max(0L, (now - compAt) / 86400000L)
                              itemWrap.addView(TextView(this).apply {
                                  text = "✓ Tracked in Spaced Repetition (${if (dAgo == 0L) "Completed Today" else "Completed ${dAgo}d ago"})"
                                  setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                                  setTextColor(Color.parseColor("#00E5A3"))
                                  setPadding(dp(4), dp(8), 0, 0)
                              })
                          }

                          itemWrap.addView(secBtn("View Recorded Mistakes ($errCount)") {
                              showChapterErrorsModal(selectedSubj, chap)
                          })
                      }
                      listCard.addView(itemWrap)
                  }
                  contentCol.addView(listCard)
              }

              // ========================================================================
              // SCREEN 3: ERROR LOG (FILTER PILLS + CLEAN ALIGNMENT + PHOTO VAULT)
              // ========================================================================
              private fun buildErrorLogScreen() {
                  val all = getArr("error_book_list")
                  contentCol.addView(topScreenHeader("Error Log", "＋") { promptAddErrorModal() })

                  // Filter Pills: All | Physics | Chemistry | Maths
                  val fRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          bottomMargin = dp(14)
                      }
                  }
                  for (f in listOf("All", "Physics", "Chemistry", "Mathematics")) {
                      val cnt = if (f == "All") all.length() else (0 until all.length()).count { all.getJSONObject(it).optString("subject") == f }
                      val shortF = if (f == "Mathematics") "Maths" else f
                      val on = (errFilter == f)
                      val p = TextView(this).apply {
                          text = "$shortF ($cnt)"
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 11.5f)
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.WHITE)
                          background = ripple(if (on) "#6C47FF" else "#161329", 18f, if (on) "#9D7BFF" else "#282246")
                          setPadding(dp(11), dp(7), dp(11), dp(7))
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                              rightMargin = dp(6)
                          }
                      }
                      spring(p) { errFilter = f; renderScreen(false, true) }
                      fRow.addView(p)
                  }
                  contentCol.addView(fRow)

                  if (all.length() == 0) {
                      contentCol.addView(cardBox().apply {
                          addView(TextView(this@MainActivity).apply {
                              text = "No mistakes logged yet. Tap '+ Add Error' below to capture a question photo or note."
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                              setTextColor(Color.parseColor("#94A3B8"))
                          })
                      })
                  } else {
                      for (i in all.length() - 1 downTo 0) {
                          val o = all.getJSONObject(i)
                          if (errFilter != "All" && o.optString("subject") != errFilter) continue
                          contentCol.addView(renderErrorCard(o, i, all))
                      }
                  }

                  val addErrBtn = TextView(this).apply {
                      text = "＋  Add Error"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = grad("#7C4DFF", "#5B21B6", 16f, "#A78BFA")
                      setPadding(dp(20), dp(14), dp(20), dp(14))
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          topMargin = dp(8)
                      }
                  }
                  spring(addErrBtn) { promptAddErrorModal() }
                  contentCol.addView(addErrBtn)
              }

              private fun renderErrorCard(o: JSONObject, idx: Int, full: JSONArray?): View {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = ripple("#161329", 16f, "#282246")
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                          bottomMargin = dp(10)
                      }
                  }
                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val subj = o.optString("subject", "Physics")
                  val isChem = subj == "Chemistry"
                  top.addView(TextView(this).apply {
                      text = if (isChem) "!" else "✕"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      background = ripple(if (isChem) "#F59E0B" else "#EF4444", 50f)
                      layoutParams = LinearLayout.LayoutParams(dp(26), dp(26)).apply { rightMargin = dp(12) }
                  })

                  val mid = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  mid.addView(TextView(this).apply {
                      text = "${o.optString("date", "2026-11-13")} • ${o.optString("chapter", "")}"
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                      setTextColor(Color.parseColor("#94A3B8"))
                  })
                  mid.addView(TextView(this).apply {
                      text = o.optString("note", "")
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, dp(2), 0, 0)
                  })
                  top.addView(mid)

                  top.addView(TextView(this).apply {
                      text = if (subj == "Mathematics") "Maths" else subj
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 10.5f)
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      background = ripple(if (isChem) "#3B2818" else "#1E294B", 10f, if (isChem) "#F59E0B" else "#3B82F6")
                      setPadding(dp(9), dp(4), dp(9), dp(4))
                  })
                  card.addView(top)

                  val uri = o.optString("uri", "")
                  if (uri.isNotEmpty()) {
                      val iv = ImageView(this).apply {
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(160)).apply { topMargin = dp(10) }
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          background = ripple("#0E0B1A", 12f, "#282246")
                          clipToOutline = true
                      }
                      loadThumb(uri, iv)
                      spring(iv) { openDoc(uri) }
                      card.addView(iv)
                  }

                  if (idx >= 0 && full != null) {
                      val delRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.END
                          layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(8) }
                      }
                      delRow.addView(chipBtn("Delete", "#282246") {
                          val up = JSONArray()
                          for (j in 0 until full.length()) if (j != idx) up.put(full.getJSONObject(j))
                          saveArr("error_book_list", up)
                          renderScreen(false, true)
                      })
                      card.addView(delRow)
                  }
                  return card
              }

