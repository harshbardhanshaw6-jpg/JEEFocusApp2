              private fun getCompletedChaptersWithDays(): List<Triple<String, String, Long>> {
                  val res = mutableListOf<Triple<String, String, Long>>()
                  val now = System.currentTimeMillis()
                  for ((s, list) in syllabus) {
                      for (c in list) {
                          if (prefs.getInt("status_${s}_$c", 0) == 2) {
                              var t = prefs.getLong("time_${s}_$c", 0L)
                              if (t <= 0L) {
                                  t = now
                                  prefs.edit().putLong("time_${s}_$c", t).apply()
                              }
                              res.add(Triple(s, c, max(0L, (now - t) / 86400000L)))
                          }
                      }
                  }
                  return res.sortedByDescending { it.third }
              }

              private fun checkPyqAlerts(notify: Boolean) {
                  val due = getCompletedChaptersWithDays().filter { it.third >= 15L }
                  if (due.isNotEmpty() && notify) {
                      val f = due[0]
                      sendBroadcast(Intent(this, ReminderReceiver::class.java).apply {
                          putExtra("TITLE", "⚠️ 15-Day PYQ Revision Due (${due.size} Chapters)")
                          putExtra("MESSAGE", "${f.first}: ${f.second} was completed ${f.third} days ago! Revise via PYQs.")
                          putExtra("NOTIF_ID", 9915)
                      })
                  }
              }

