              private fun promptUpdateStreakModal() {
                  val current = prefs.getInt("study_streak_days", 0)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val input = editBox("Set custom streak days (Current: $current)").apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText(current.toString())
                  }
                  val plusOneBtn = priBtn("🔥 +1 Complete Today's Streak (${current + 1} Days)", "#10B981") {
                      prefs.edit().putInt("study_streak_days", current + 1).apply()
                      renderScreen(false, true)
                  }
                  val resetBtn = secBtn("Reset Streak to 0 Days") {
                      prefs.edit().putInt("study_streak_days", 0).apply()
                      renderScreen(false, true)
                  }
                  box.addView(plusOneBtn)
                  box.addView(input)
                  box.addView(resetBtn)
                  showModal("Study Streak", "Log today's study streak or set your exact day count", box, "Save") {
                      val entered = input.text.toString().trim().toIntOrNull() ?: current
                      prefs.edit().putInt("study_streak_days", max(0, entered)).apply()
                      renderScreen(false, true)
                  }
              }

              private fun promptEditTodayGoalModal() {
                  val currentGoal = prefs.getString("user_today_goal", "") ?: ""
                  val isDone = prefs.getBoolean("today_goal_done", false)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val input = editBox("Enter your goal for today (e.g., Solve 40 Electrostatics PYQs)").apply {
                      setText(currentGoal)
                  }
                  box.addView(input)
                  if (currentGoal.isNotEmpty()) {
                      box.addView(secBtn(if (isDone) "Mark Goal as Pending" else "✓ Mark Today's Goal Completed") {
                          prefs.edit().putBoolean("today_goal_done", !isDone).apply()
                          renderScreen(false, true)
                      })
                      box.addView(secBtn("Clear Today's Goal") {
                          prefs.edit().putString("user_today_goal", "").putBoolean("today_goal_done", false).apply()
                          renderScreen(false, true)
                      })
                  }
                  showModal("Today's Goal", "Set your primary study target for today", box, "Save Goal") {
                      val txt = input.text.toString().trim()
                      prefs.edit().putString("user_today_goal", txt).apply()
                      renderScreen(false, true)
                  }
              }

