              private fun getChapterPct(subj: String, chap: String): Int {
                  val key = "${subj}_$chap"
                  if (prefs.contains("pct_$key")) return prefs.getInt("pct_$key", 0)
                  return when (prefs.getInt("status_$key", 0)) {
                      2 -> 100
                      1 -> 50
                      else -> 0
                  }
              }

              private fun setChapterPct(subj: String, chap: String, pct: Int) {
                  val key = "${subj}_$chap"
                  val clamped = pct.coerceIn(0, 100)
                  val status = if (clamped == 100) 2 else if (clamped > 0) 1 else 0
                  val ed = prefs.edit().putInt("pct_$key", clamped).putInt("status_$key", status)
                  if (clamped == 100) {
                      if (prefs.getLong("time_$key", 0L) <= 0L) {
                          ed.putLong("time_$key", System.currentTimeMillis())
                      }
                  } else {
                      ed.putLong("time_$key", 0L)
                  }
                  ed.apply()
              }

              private fun computeSubjectPercentage(subj: String): Int {
                  val list = syllabus[subj] ?: return 0
                  if (list.isEmpty()) return 0
                  var sum = 0
                  for (c in list) sum += getChapterPct(subj, c)
                  return (sum.toFloat() / list.size).roundToInt()
              }

