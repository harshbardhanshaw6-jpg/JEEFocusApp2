name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate Clean Project Structure & Files
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/myandroidapp
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JEEFocusApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.myandroidapp'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.myandroidapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.activity:activity-ktx:1.8.2'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B0F19" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#151C2C" android:strokeColor="#4F46E5" android:strokeWidth="3.5"
                  android:pathData="M54,14 L88,30 L88,62 C88,80 54,94 54,94 C54,94 20,80 20,62 L20,30 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#10B981" android:strokeWidth="2"
                  android:pathData="M54,22 L80,35 L80,60 C80,74 54,86 54,86 C54,86 28,74 28,60 L28,35 Z" />
              <path android:fillColor="#00000000" android:strokeColor="#38BDF8" android:strokeWidth="3"
                  android:pathData="M54,36 A18,18 0 1,1 53.9,36 Z" />
              <path android:strokeColor="#10B981" android:strokeWidth="3"
                  android:pathData="M54,26 L54,42 M54,66 L54,82 M26,54 L42,54 M66,54 L82,54" />
              <path android:fillColor="#10B981" android:pathData="M54,48 A6,6 0 1,1 53.9,48 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/res/xml/device_admin_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="JEE Focus Command"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FocusAccessibilityService"
                      android:exported="true"
                      android:label="JEE Focus App and Website Shield"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <receiver
                      android:name=".FocusDeviceAdminReceiver"
                      android:exported="true"
                      android:label="JEE Focus Admin Lock"
                      android:permission="android.permission.BIND_DEVICE_ADMIN">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin_config" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.USER_PRESENT" />
                      </intent-filter>
                  </receiver>

              </application>

          </manifest>
          EOF

