              private fun promptAddOrEditDayTask(dayName: String, editIdx: Int, existingObj: JSONObject?) {
                  val isEdit = (editIdx >= 0 && existingObj != null)
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val taskIn = editBox("Task Name (e.g., Physics: Laws of Motion)").apply {
                      if (isEdit) setText(existingObj?.optString("task", ""))
                  }
                  val timeIn = editBox("Time Slot (e.g., 2:00 PM - 4:00 PM)").apply {
                      if (isEdit) setText(existingObj?.optString("time", ""))
                  }
                  box.addView(taskIn)
                  box.addView(timeIn)

                  if (isEdit) {
                      val slots = getArr("schedule_$dayName")
                      val curDone = existingObj?.optBoolean("done", false) ?: false
                      box.addView(secBtn(if (curDone) "Mark as Pending" else "✓ Mark Task Completed") {
                          existingObj?.put("done", !curDone)
                          saveArr("schedule_$dayName", slots)
                          renderScreen(false, true)
                      })
                      box.addView(secBtn("🗑 Delete Task") {
                          val up = JSONArray()
                          for (j in 0 until slots.length()) if (j != editIdx) up.put(slots.getJSONObject(j))
                          saveArr("schedule_$dayName", up)
                          renderScreen(false, true)
                      })
                  }

                  showModal(
                      if (isEdit) "Edit $dayName Task" else "Add Task to $dayName",
                      "Enter your custom task and time slot for $dayName",
                      box,
                      if (isEdit) "Update" else "Add Task"
                  ) {
                      val t = taskIn.text.toString().trim()
                      val tm = timeIn.text.toString().trim().ifEmpty { "Flexible Time" }
                      if (t.isNotEmpty()) {
                          val arr = getArr("schedule_$dayName")
                          if (isEdit) {
                              existingObj?.put("task", t)
                              existingObj?.put("time", tm)
                          } else {
                              arr.put(JSONObject().apply {
                                  put("task", t)
                                  put("time", tm)
                                  put("done", false)
                              })
                          }
                          saveArr("schedule_$dayName", arr)
                          renderScreen(false, true)
                      }
                  }
              }

