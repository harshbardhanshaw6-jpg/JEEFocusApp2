                      prefs.edit().putString("last_morning_quote_date", today).apply()
                      showQuoteModal(unlock)
                  }
              }

              override fun onResume() { super.onResume(); uiHandler.post(tick); renderScreen(false, true) }
              override fun onPause() { super.onPause(); uiHandler.removeCallbacks(tick) }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).roundToInt()
              private fun dpF(v: Float): Float = v * resources.displayMetrics.density

              private fun spring(v: View, click: () -> Unit) {
                  v.isClickable = true; v.isFocusable = true
                  v.setOnTouchListener { view, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> view.animate().scaleX(0.95f).scaleY(0.95f).setDuration(80).setInterpolator(DecelerateInterpolator()).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> view.animate().scaleX(1f).scaleY(1f).setDuration(165).setInterpolator(OvershootInterpolator(1.6f)).start()
                      }
                      false
                  }
                  v.setOnClickListener { click() }
              }

              private fun ripple(fill: String, rad: Float, stroke: String? = null): RippleDrawable {
                  val gd = GradientDrawable().apply {
                      setColor(Color.parseColor(fill)); cornerRadius = dpF(rad)
                      if (stroke != null) setStroke(dp(1).coerceAtLeast(1), Color.parseColor(stroke))
                  }
                  val mask = GradientDrawable().apply { setColor(Color.WHITE); cornerRadius = dpF(rad) }
                  return RippleDrawable(ColorStateList.valueOf(Color.parseColor("#2AFFFFFF")), gd, mask)
              }

              private fun grad(c1: String, c2: String, rad: Float, stroke: String? = null): GradientDrawable {
                  return GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(Color.parseColor(c1), Color.parseColor(c2))).apply {
                      cornerRadius = dpF(rad)
                      if (stroke != null) setStroke(dp(1), Color.parseColor(stroke))
                  }
              }

              private fun seedInitialDataIfNeeded() {
                  if (prefs.getBoolean("ascend_seeded_v4", false)) return
                  val defDays = mapOf(
                      "Mon" to listOf(Pair("Revision: Kinematics", "2:00 PM - 3:30 PM"), Pair("PYQs (2019-24)", "7:00 PM - 8:00 PM")),
                      "Tue" to listOf(Pair("Chemistry: GOC", "2:00 PM - 4:00 PM"), Pair("Mock Test (Full)", "7:00 PM - 10:00 PM")),
                      "Wed" to listOf(Pair("Physics: Laws of Motion", "2:00 PM - 3:30 PM"), Pair("Maths: Quadratic Eq.", "7:00 PM - 8:30 PM")),
                      "Thu" to listOf(Pair("Physics: Electrodynamics", "4:00 PM - 6:00 PM"), Pair("Chemistry: Thermodynamics", "8:00 PM - 9:30 PM")),
                      "Fri" to listOf(Pair("Maths: Definite Integration", "4:00 PM - 6:00 PM"), Pair("Error Log Revision", "8:30 PM - 10:00 PM")),
                      "Sat" to listOf(Pair("Physics: Ray Optics PYQs", "10:00 AM - 12:30 PM"), Pair("Chemistry: Coordination", "4:00 PM - 6:00 PM")),
                      "Sun" to listOf(Pair("Full 3-Hour JEE Main Mock Test", "9:00 AM - 12:00 PM"), Pair("Mock Test Mistake Analysis", "4:00 PM - 6:00 PM"))
                  )
                  for ((d, list) in defDays) {
                      val arr = JSONArray()
                      for ((task, time) in list) {
                          arr.put(JSONObject().apply { put("task", task); put("time", time); put("done", d == "Mon") })
                      }
                      saveArr("schedule_$d", arr)
                  }
                  // Seed 1 completed chapter so Spaced Repetition is visible immediately
                  prefs.edit()
                      .putInt("status_Physics_Mechanics", 2)
                      .putLong("time_Physics_Mechanics", System.currentTimeMillis() - 2L * 86400000L)
                      .putInt("status_Physics_Electrodynamics", 1)
                      .putBoolean("ascend_seeded_v4", true)
                      .apply()
              }

              private fun initPickers() {
                  sheetPicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { u: Uri? ->
                      if (u != null) {
                          try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                          val arr = getArr("worksheets_list")
                          arr.put(JSONObject().apply { put("title", pSheetTitle); put("subject", pSheetSubj); put("uri", u.toString()); put("done", false) })
                          saveArr("worksheets_list", arr); renderScreen(false, true)
                      }
                  }
                  errPicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { u: Uri? ->
                      if (u != null) {
                          try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                          saveErrorItem(pErrSubj, pErrChap, pErrNote, u.toString())
                          Toast.makeText(this, "Error saved to $pErrChap!", Toast.LENGTH_SHORT).show()
                          renderScreen(false, true)
                      }
                  }
                  ttPicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { u: Uri? ->
                      if (u != null) {
                          try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                          prefs.edit().putString("uploaded_timetable_uri", u.toString()).apply()
                          renderScreen(false, true)
                      }
                  }
              }

