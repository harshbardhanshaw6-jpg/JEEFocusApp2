              private fun showMorningUnlockDialog(closeAppOnDismiss: Boolean) {
                  val dialog = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#090D16"))
                      setPadding(64, 64, 64, 64)
                  }

                  val badge = TextView(this).apply {
                      text = "NEW DAY • FIRST UNLOCK MOTIVATION"
                      textSize = 13f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }

                  val quoteText = TextView(this).apply {
                      text = "Fetching today's daily quote from the internet..."
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(0, 48, 0, 48)
                  }

                  val actionBtn = createStyledButton("Begin Today's Grind & Close", "#10B981") {
                      dialog.dismiss()
                      if (closeAppOnDismiss) {
                          finishAndRemoveTask()
                      }
                  }

                  root.addView(badge)
                  root.addView(quoteText)
                  root.addView(actionBtn)
                  dialog.setContentView(root)
                  dialog.show()

                  Thread {
                      var fetchedQuote: String? = null
                      try {
                          val url = URL("https://zenquotes.io/api/random")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              connectTimeout = 3500
                              readTimeout = 3500
                              requestMethod = "GET"
                          }
                          if (conn.responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val response = reader.readText()
                              reader.close()
                              val arr = JSONArray(response)
                              if (arr.length() > 0) {
                                  val obj = arr.getJSONObject(0)
                                  fetchedQuote = "\"${obj.getString("q")}\"\n\n- ${obj.getString("a")}"
                              }
                          }
                      } catch (_: Exception) {}

                      val finalQuote = fetchedQuote ?: fallbackQuotes.random()
                      prefs.edit().putString("cached_daily_quote", finalQuote).apply()
                      runOnUiThread {
                          quoteText.text = finalQuote
                      }
                  }.start()
              }

