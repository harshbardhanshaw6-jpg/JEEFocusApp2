name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate JEE Ascend Clean User-Driven App
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/example/myandroidapp
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/xml

          # Download real stargazing night sky hero image (with fallback generator if URL is unreachable)
          curl -sL "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1000&q=85" -o app/src/main/res/drawable-nodpi/hero_stargazer.jpg || true
          python3 - << 'PYEOF'
          import os, struct, zlib
          path = "app/src/main/res/drawable-nodpi/hero_stargazer.jpg"
          if not os.path.exists(path) or os.path.getsize(path) < 5000:
              # Fallback: create a valid high-res twilight starfield PNG if download failed
              os.remove(path) if os.path.exists(path) else None
              png_path = "app/src/main/res/drawable-nodpi/hero_stargazer.png"
              w, h = 600, 360
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      r = int(12 + (y / h) * 28)
                      g = int(10 + (y / h) * 18)
                      b = int(28 + (y / h) * 52)
                      raw.extend((r, g, b))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", w, h, 8, 2, 0, 0, 0)
              with open(png_path, "wb") as f:
                  f.write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 6)) + chunk(b"IEND", b""))
          PYEOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JEEFocusApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.myandroidapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.harsh.jeeprep.tracker"
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName "5.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0B0914" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#6C47FF" android:pathData="M54,18 L86,84 L70,84 L54,48 L38,84 L22,84 Z"/>
              <path android:fillColor="#00E5A3" android:pathData="M43,66 L65,66 L71,78 L37,78 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="120" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="JEE Ascend"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FocusAccessibilityService"
