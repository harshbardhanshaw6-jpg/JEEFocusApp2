                      }

                      if (slots.length() == 0) {
                          tasksCol.addView(TextView(this).apply {
                              text = "No tasks scheduled for $dName. Tap + Add Task below."
                              setTextSize(TypedValue.COMPLEX_UNIT_SP, 12.5f)
                              setTextColor(Color.parseColor("#64748B"))
