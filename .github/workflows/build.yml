              private fun promptAddErrorModal() {
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  var selS = selectedSubj
                  var selC = (syllabus[selS] ?: emptyList()).first()
                  val sRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val cBtn = secBtn("Chapter: $selC ▾") {}
                  val sViews = mutableListOf<TextView>()
                  val sList = listOf("Physics", "Chemistry", "Mathematics")

                  fun sync() {
                      for (i in sList.indices) {
                          val on = (sList[i] == selS)
                          sViews[i].background = ripple(if (on) "#6C47FF" else "#1C1833", 10f)
                      }
                      selC = (syllabus[selS] ?: emptyList()).first()
                      cBtn.text = "Chapter: $selC ▾"
                  }
                  for (s in sList) {
                      val tv = TextView(this).apply {
                          text = if (s == "Mathematics") "Maths" else s
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f); setTextColor(Color.WHITE); setTypeface(null, Typeface.BOLD)
                          gravity = Gravity.CENTER; setPadding(dp(8), dp(9), dp(8), dp(9))
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(dp(2), 0, dp(2), 0) }
                      }
                      spring(tv) { selS = s; sync() }
                      sViews.add(tv); sRow.addView(tv)
                  }
                  sync()
                  spring(cBtn) {
                      val chList = syllabus[selS] ?: emptyList()
                      val nextIdx = (chList.indexOf(selC) + 1) % chList.size
                      selC = chList[nextIdx]
                      cBtn.text = "Chapter: $selC ▾"
                  }
                  val noteIn = editBox("Mistake description (e.g., Forgot formula a = v²/r)")
                  val photoBtn = secBtn("Pick Mistake Photo from Gallery") {
                      pErrSubj = selS; pErrChap = selC
                      pErrNote = noteIn.text.toString().trim().ifEmpty { "$selC: Concept Trap" }
                      errPicker.launch(arrayOf("image/*"))
                  }
                  box.addView(sRow); box.addView(cBtn); box.addView(noteIn); box.addView(photoBtn)

                  showModal("Add Error to Log", "Save a text mistake or attach a photo", box, "Save Text Error") {
                      val n = noteIn.text.toString().trim().ifEmpty { "$selC: Concept Trap" }
                      saveErrorItem(selS, selC, n, "")
                      renderScreen(false, true)
                  }
              }

              private fun saveErrorItem(subj: String, chap: String, note: String, uri: String) {
                  val arr = getArr("error_book_list")
                  arr.put(JSONObject().apply {
                      put("subject", subj); put("chapter", chap); put("note", note); put("uri", uri)
                      put("date", SimpleDateFormat("yyyy-MM-dd • h:mm a", Locale.US).format(Date()))
                  })
                  saveArr("error_book_list", arr)
              }

              private fun showChapterErrorsModal(subj: String, chap: String) {
                  val all = getArr("error_book_list"); val fil = JSONArray()
